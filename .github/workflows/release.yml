name: release
on:
  push: { branches: [main] }

# The job authenticates as the ryanlindsey-bot GitHub App rather than as the workflow's own token,
# so GITHUB_TOKEN is left with nothing granted and nothing asks for anything back.
#
# ryanlindsey-bot must be installed on this repo with repository permissions Contents: write,
# Pull requests: write and Issues: write. Issues is the non-obvious one: release-please creates
# and applies its own `autorelease:` labels, which is label writing on an issue rather than on a
# pull request. A missing app permission fails the same way the missing job permission used to —
# at run time, not at review time.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # `client-id`, not `app-id`: v3 of the action deprecates the numeric App ID in favour of the
      # app's Client ID, and warns on every run that still passes it. They are different values on
      # the same settings page and neither is secret, but a swap between them fails at mint time.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

# There was a second job here once. dist/server.js is committed and embeds the version, and
# release-please could not patch it: esbuild inlined VERSION as a bare literal and stripped the
# annotation its `generic` updater looks for. So the job checked out the release branch, rebuilt
# the bundle and pushed it back — which worked, but meant every release PR opened with a stale
# bundle, failed ci.yml's "bundle is current" step, and only went green on the second run after
# the push landed. Worse, that push was the single point of failure nothing watched: if it failed,
# the PR sat merge-ready with a stale bundle and the only warning was a red job in the Actions tab.
#
# esbuild.config.mjs now re-attaches the marker after bundling, and release-please-config.json
# lists dist/server.js as an extra-file. The bundle is bumped in the same commit as everything
# else, ci.yml is green on the release PR's first run, and no second actor writes to the branch.
# If that ever regresses, the fix belongs in the build's annotation step — not in a job here.
